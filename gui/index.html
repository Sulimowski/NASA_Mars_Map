<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#23272c">
  <title>Mars Survival Map</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three-0.160.0.module.min.js" } }</script>
</head>
<body>
  <canvas id="globe" aria-label="Mars globe"></canvas>
  <div id="labels"></div>
  <p class="loading">Loading the globe…</p>

  <header class="topbar">
    <h1>Mars Survival Map</h1>
    <span class="grow"></span>
    <div class="modes" role="group" aria-label="Display mode">
      <button class="on" aria-pressed="true">iPad</button>
      <button disabled title="Not available yet">Helmet</button>
    </div>
  </header>

  <aside class="panel" id="side">
    <section>
      <h2>Locations</h2>
      <ul id="list"></ul>
    </section>
    <section>
      <h2>Details</h2>
      <div id="info"></div>
    </section>
  </aside>

  <footer class="statusbar">
    <span id="cursor"></span>
    <span class="grow"></span>
    <span class="credit">Viking orbiter mosaic, NASA / USGS</span>
    <span>Drag: rotate. Wheel or pinch: zoom</span>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
