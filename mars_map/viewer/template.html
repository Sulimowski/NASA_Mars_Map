<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Survival Map</title>
<link rel="icon" href="data:,">
<style>
/* A working tool, not a poster: system fonts, panels docked to the window edges, native
   form controls, one selection colour. Nothing is loaded from the network. */
:root{
  --view:#0f1114; --panel:#1b1e22; --head:#23272c; --line:#31363c; --hover:#262b31;
  --text:#d9dce0; --dim:#8d949c; --sel:#2b5f9e; --link:#7db3ea;
  --ok:#4cae6e; --warn:#d9a13a; --bad:#e0664a;
  --bar:38px; --status:26px; --lw:292px; --rw:312px;
  --ui:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--view);color:var(--text);
  font:12.5px/1.45 var(--ui);font-variant-numeric:tabular-nums}
body.bare{--lw:0px;--rw:0px}
body.bare .panel{display:none}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:-2px}

/* ---- frame: top bar, two panels, status bar; the map takes what is left ---- */
.topbar{position:fixed;left:0;right:0;top:0;height:var(--bar);display:flex;align-items:center;gap:14px;
  padding:0 12px;background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
.topbar a{text-decoration:none}
.topbar a:hover{text-decoration:underline}
.topbar .sep{color:var(--dim)}
.topbar h1{margin:0;font-size:13px;font-weight:600;text-transform:capitalize}
.topbar .meta{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.panel{position:fixed;top:var(--bar);bottom:var(--status);background:var(--panel);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a5058 transparent}
.panel.left{left:0;width:var(--lw);border-right:1px solid var(--line)}
.panel.right{right:0;width:var(--rw);border-left:1px solid var(--line)}
.statusbar{position:fixed;left:0;right:0;bottom:0;height:var(--status);display:flex;align-items:center;gap:18px;
  padding:0 12px;background:var(--head);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap}
.statusbar .grow{flex:1}
.statusbar span{overflow:hidden;text-overflow:ellipsis}
#sbpos{color:var(--text)}
#sbpos i{font-style:normal;color:#5b636c;margin:0 7px}
#sbpos b.bad{font-weight:400;color:var(--bad)}
#foot{display:none}
#gl,#labels{position:fixed;left:var(--lw);right:var(--rw);top:var(--bar);bottom:var(--status)}
#gl{width:calc(100% - var(--lw) - var(--rw));height:calc(100% - var(--bar) - var(--status));display:block;cursor:grab;touch-action:none}
#gl{background:radial-gradient(120% 75% at 50% 18%,#3a2a21 0%,#261d19 38%,#1a1716 70%,#141516 100%)}
#gl.dragging{cursor:grabbing}
#labels{pointer-events:none;overflow:hidden;box-shadow:inset 0 0 170px rgba(0,0,0,.42)}

/* ---- labels on the map ---- */
/* Map lettering, not boxes: light text with a dark halo reads on bright and dark ground
   alike, like the names on a printed map. The number is a small coloured figure. */
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  color:#f3efe6;font-size:11.5px;font-weight:600;line-height:15px;padding:0 2px 1px;letter-spacing:.01em;
  text-shadow:0 0 2px #000,0 0 3px #000,0 1px 4px rgba(0,0,0,.9),1px 0 1px #000,-1px 0 1px #000,0 -1px 1px #000,0 1px 1px #000}
.tag b{display:inline-block;margin-right:5px;font-weight:700;color:#cfd5dc}
.tag.rover b{color:#ff9a62} .tag.base b{color:#6fe0a0} .tag.mineral b{color:#ffd45c}
.tag:hover{color:#fff} .tag:hover b{color:#fff}
.tag.on{color:#fff;border-bottom:2px solid var(--link)} .tag.on b{color:var(--link)}

/* ---- panel content ---- */
section{border-bottom:1px solid var(--line);padding:0 0 9px}
h2{margin:0 0 7px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--dim);background:var(--head);
  border-bottom:1px solid var(--line)}
section>div,section>table,section>p{margin-left:12px;margin-right:12px}
section>table{width:calc(100% - 24px)}
table{width:100%;border-collapse:collapse}
td{padding:2px 0;vertical-align:top}
td:first-child{color:var(--dim);width:46%}
td:last-child{text-align:right}
.note{margin:6px 0 0;color:var(--dim)}
section>.note{margin:6px 12px 0}

#layers,#stops{margin:0}
.group{padding:5px 12px 2px;color:var(--dim);font-size:11.5px}
.layer{display:flex;align-items:center;gap:8px;padding:3px 12px;cursor:pointer}
.layer:hover,.stop:hover{background:var(--hover)}
.layer.on,.stop.on{background:var(--sel);color:#fff}
.layer input{margin:0;accent-color:#fff}
.layer i{flex:0 0 24px;height:10px;border:1px solid #000;background:#3a3f46}
.legend .bar{height:12px;border:1px solid #000}
.legend .ends{display:flex;justify-content:space-between;margin-top:2px}
.legend .ends em{font-style:normal;color:var(--dim)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.chips span{display:flex;align-items:center;gap:6px}
.chips i{flex:0 0 11px;height:11px;border:1px solid #000}

.ctl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:8px;margin-top:4px;margin-bottom:4px}
.ctl label{color:var(--dim)}
.ctl output{text-align:right}
input[type=range]{width:100%;margin:0;accent-color:var(--link)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:8px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{margin:0;accent-color:var(--link)}

.stop{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;padding:3px 12px;cursor:pointer}
.stop b{text-align:center;background:#4a5058;color:#fff;font-weight:600;font-size:11.5px}
.stop.rover b{background:#a8521f} .stop.base b{background:#35805a}
.stop small{color:var(--dim);font-size:11.5px} .stop.on small{color:#d5e3f3}
#detail{display:none;margin:9px 12px 0;padding-top:9px;border-top:1px solid var(--line)}
#detail h3{margin:0 0 3px;font-size:13px;font-weight:600}
#detail img{display:block;width:100%;margin-top:8px;border:1px solid #000}

.plans{width:100%;border-collapse:collapse;margin-bottom:9px}
.plans th{font-weight:400;color:var(--dim);text-align:right;padding:0 0 3px}
.plans th:first-child,.plans td:first-child{text-align:left}
.plans td{padding:3px 0;text-align:right}
.plans td:first-child{color:inherit;width:auto;padding-left:4px}
.plans tr.row{cursor:pointer}
.plans tr.row:hover{background:var(--hover)}
.plans tr.row.on{background:var(--sel);color:#fff}
.plans td i{display:inline-block;width:8px;height:8px;margin-right:7px;background:var(--ok)}
.plans td i.bad{background:var(--bad)}
.ctl select{width:100%;font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line);padding:2px 4px}
.ctl.wide{grid-template-columns:84px 1fr}
.ctl button{font:inherit;color:var(--text);background:var(--hover);border:1px solid var(--line);padding:1px 0;cursor:pointer}
.ctl button:hover{background:var(--sel)}
svg.hours{display:block;width:100%;height:64px;margin-top:8px;overflow:visible}
.hours text{font:11px var(--ui);fill:var(--dim)}
.status{display:flex;align-items:center;gap:7px;margin-top:0;margin-bottom:6px;font-weight:600}
.status i{width:9px;height:9px;background:var(--ok)} .status.bad i{background:var(--bad)}
.warn{margin:6px 0 0;color:var(--warn)}
#edit{padding:0 12px}
#edit .row button{flex:1;white-space:nowrap;padding:4px 6px}
.prog{height:4px;margin:2px 0 5px;background:#2a2f35;border:1px solid #000;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3f8fd6,#7db3ea);transition:width .12s linear}
p.facts{margin:4px 0 0}
.modes{display:flex;gap:6px;margin:0 0 8px}
.modes button{flex:1;font:inherit;text-align:left;color:var(--text);background:#30353c;border:1px solid #4a5058;padding:5px 9px;cursor:pointer}
.modes button:hover{background:var(--hover)}
.modes button.on{background:var(--sel);border-color:var(--sel);color:#fff}
.modes button b{display:block;font-weight:600}
.modes button span{font-size:11.5px;opacity:.85}
.stop small .eta{color:var(--dim);margin-right:4px}
#stops{margin-top:4px}
#edit .row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.trip{display:flex;align-items:center;gap:9px;margin:7px 0 2px}
.trip button{font:inherit;color:#fff;background:var(--sel);border:1px solid var(--sel);padding:4px 11px;cursor:pointer;white-space:nowrap}
.trip button:hover{filter:brightness(1.12)}
.trip span{color:var(--dim)}
#edit button{font:inherit;color:var(--text);background:#30353c;border:1px solid #4a5058;padding:4px 9px;cursor:pointer}
#edit button:hover{background:var(--hover)}
#edit button.on{background:var(--sel);border-color:var(--sel);color:#fff}
#edit button.go{background:var(--ok);border-color:var(--ok);color:#10140f;font-weight:600}
#edit button:disabled{opacity:.45;cursor:default}
#edit .note{margin:0 0 6px}
.stop .x,.stop .e{cursor:pointer;color:var(--dim);padding:0 3px} .stop .x:hover{color:var(--bad)} .stop .e:hover{color:var(--link)}
.stop input{font:inherit;color:var(--text);background:#1c1f23;border:1px solid var(--sel);padding:0 4px;width:100%;min-width:0;box-sizing:border-box}
canvas.placing{cursor:crosshair}
svg.spark{display:block;width:100%;height:34px;margin-top:1px;overflow:visible}
.spark text{font:11px var(--ui);fill:var(--dim)}
.series{margin:8px 0 0}
.series span{color:var(--dim)}

/* ---- left panel: site line, the sky-to-rock column, time ---- */
.site{padding:9px 12px 10px}
.site b{display:block;font-size:13px;font-weight:600;text-transform:capitalize;margin-bottom:2px}
.site span{color:var(--dim)}
#column{position:relative;margin:2px 12px 0 12px;padding:0 0 0 22px;outline:none;cursor:pointer;user-select:none;touch-action:none}
#column:focus-visible{outline:2px solid var(--link);outline-offset:2px}
#column::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:5px;border:1px solid #000;
  background:linear-gradient(#05070b 0%,#3b4250 14%,#a0705a 34%,#c28a5f 46%,#d7a273 50%,#8a5a3e 56%,#5a3b2a 74%,#2e211b 100%)}
.lv{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px;padding:2px 0 2px 6px;color:var(--dim)}
.lv:hover{color:var(--text)}
.lv small{font-size:11px;color:#6d747c}
.lv.on{color:#fff;font-weight:600}
#column .handle{position:absolute;left:2px;top:0;width:13px;height:13px;margin-top:-7px;border:2px solid #fff;border-radius:50%;background:var(--sel);box-sizing:border-box;pointer-events:none;transition:top .32s cubic-bezier(.3,.7,.2,1)}
#column.dragging .handle{transition:none}
.lv{transition:color .25s}
.plan-pick{display:flex;flex-wrap:wrap;gap:3px 14px;margin:6px 12px 0}
.plan-pick label{display:flex;align-items:center;gap:6px;cursor:pointer}
.plan-pick input{margin:0;accent-color:var(--link)}
.lv.ground{margin-top:3px;padding-top:4px;border-top:1px solid #8a7a6a}
.lv.ground+.lv{margin-top:3px;border-top:1px solid #8a7a6a;padding-top:4px}
.lv.nodata{font-style:italic}
#levelBox{margin:9px 12px 0}
#levelText{margin:0 0 6px;color:var(--text)}
#levelText em{font-style:normal;color:var(--dim)}
#allLayers summary{padding:7px 12px;color:var(--dim);cursor:pointer;list-style-position:inside}
#allLayers summary:hover{color:var(--text)}
#allLayers[open] summary{color:var(--text)}
body.space #gl{background:radial-gradient(120% 75% at 50% 18%,#151a24 0%,#0b0e14 45%,#06070a 100%)}

.compass{position:fixed;right:calc(var(--rw) + 12px);top:calc(var(--bar) + 12px);width:44px;height:44px}
.compass svg{width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--view);color:var(--dim);z-index:9}
#loading.gone{display:none}
@media (max-width:1000px){:root{--rw:0px;--lw:264px}.panel.right{display:none}.topbar .meta{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header class="topbar">
  <a href="../../gui/index.html">Mars Survival Map</a><span class="sep">/</span>
  <h1 id="title">Site</h1>
  <span class="meta" id="coords"></span>
  <span class="grow"></span>
</header>

<aside class="panel left">
  <section class="site"><div id="facts"></div></section>
  <section><h2>Levels</h2>
    <div id="column" tabindex="0" title="Click or drag a level. Arrow keys move it, double-click returns to the surface."></div>
    <div class="legend" id="levelBox"><p id="levelText"></p><div id="legend"></div></div>
  </section>
  <section><h2>Time</h2>
    <div class="ctl wide"><label for="dvs">Season</label><select id="dvs"></select></div>
    <div class="ctl"><label for="dvh">Local time</label><input id="dvh" type="range" min="0" max="23.95" step="0.05"><output id="dvhv"></output></div>
    <div class="ctl"><label></label><button id="dvp" type="button">Play</button><span></span></div>
    <p class="note" id="sunText"></p>
  </section>
  <section><h2>On the map</h2>
    <div class="toggles" id="toggles"></div>
    <p class="note" style="margin:10px 12px 0">Planning overlay</p>
    <div class="plan-pick" id="planPick"></div>
    <div id="planLegend" class="legend" style="margin:4px 12px 0"></div>
    <div class="ctl" style="margin-top:9px"><label for="ex">Relief scale</label><input id="ex" type="range" min="0.5" max="3" step="0.05" value="1"><output id="exv"></output></div>
    <div class="ctl"><label for="op">Overlay</label><input id="op" type="range" min="0" max="1" step="0.01" value="0.85"><output id="opv"></output></div>
  </section>
  <section><details id="allLayers"><summary>All layers</summary><div id="layers"></div></details></section>
</aside>

<aside class="panel right">
  <section><h2>Walk</h2><div id="edit"></div><div id="stops"></div><div id="detail"></div></section>
  <section id="planBox" style="display:none"><h2>Routes</h2><div id="plan"></div></section>
  <section id="devilBox" style="display:none"><h2>Dust devils</h2>
    <div id="devils"></div>
    <div class="ctl wide" style="margin-top:8px"><label></label><button id="dvt" type="button" title="Sends one vortex across the route ahead of the astronaut">Send one across the route</button></div>
    <p class="note" id="dvlog" style="margin:4px 12px 0"></p>
  </section>
</aside>

<div class="compass" title="North"><svg viewBox="-30 -30 60 60">
  <circle r="27" fill="#1b1e22" stroke="#4a5058"/>
  <g id="needle"><path d="M0-22 6 0H-6Z" fill="#e0664a"/><path d="M0 22 6 0H-6Z" fill="#8d949c"/>
  <text y="-8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600" fill="#fff">N</text></g></svg></div>

<footer class="statusbar">
  <span id="sbpos"></span>
  <span class="grow"></span>
  <span id="foot"></span>
  <span>Drag: orbit. Right-drag: pan. Wheel: zoom. H: panels</span>
</footer>
<div id="loading">Loading terrain…</div>

<script id="three-src" type="text/plain">/*__THREE_SOURCE__*/</script>
<script id="site-data" type="application/json">/*__SITE_DATA__*/</script>
<script type="module">
const D = JSON.parse(document.getElementById('site-data').textContent);
const $ = id => document.getElementById(id);
const u8 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

async function loadThree() {
  const src = $('three-src').textContent;
  if (src.length > 5000) return import(URL.createObjectURL(new Blob([src], {type: 'text/javascript'})));
  return import(D.threeUrl);                       // the page was built without a cached copy
}
const THREE = await loadThree();
THREE.ColorManagement.enabled = false;

// ---------- terrain data ----------
const {rows, cols, emin, emax} = D.mesh, relief = emax - emin, W = D.width, H = D.height;
const H16 = new Uint16Array(u8(D.mesh.heights).buffer);
const probes = Object.fromEntries(Object.entries(D.probes).map(([k, p]) => [k, {...p, a: u8(p.data)}]));
let exag = 1;
function hAt(x, z) {                                // world metres (centred) -> height above the lowest point
  const fc = Math.min(Math.max((x / W + .5) * (cols - 1), 0), cols - 1.001);
  const fr = Math.min(Math.max((z / H + .5) * (rows - 1), 0), rows - 1.001);
  const c = fc | 0, r = fr | 0, u = fc - c, v = fr - r, i = r * cols + c;
  return ((H16[i] * (1 - u) + H16[i + 1] * u) * (1 - v) + (H16[i + cols] * (1 - u) + H16[i + cols + 1] * u) * v) / 65535 * relief;
}
const world = (xm, ym, lift = 0) => new THREE.Vector3(xm - W / 2, hAt(xm - W / 2, ym - H / 2) * exag + lift, ym - H / 2);

// ---------- renderer ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
let pixelRatio = Math.min(Math.max(devicePixelRatio, 1.5), 2);     // supersample a little on ordinary screens
renderer.setPixelRatio(pixelRatio);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 5, 40000);

async function texture(uri) {
  // onload, not img.decode(): decode() can wait forever while the tab is in the background
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('texture failed to load')); i.src = uri; });
  const t = new THREE.Texture(img);
  t.colorSpace = THREE.NoColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter; t.needsUpdate = true;
  return t;
}
const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1); blank.needsUpdate = true;

// Height field as a texture (metres above the lowest point, row 0 = north) for cast
// shadows and ambient occlusion in the shader.
const heightTex = (() => {
  const f = new Float32Array(rows * cols);
  for (let i = 0; i < f.length; i++) f[i] = H16[i] / 65535 * relief;
  const t = new THREE.DataTexture(f, cols, rows, THREE.RedFormat, THREE.FloatType);
  t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const SAND = D.sand;
const sandDir = SAND ? [Math.cos(SAND.wind), Math.sin(SAND.wind)] : [1, 0];   // wind axis, across the ripple crests

const uniforms = {
  uBase: {value: blank}, uLayer: {value: blank}, uLayerPrev: {value: blank}, uLayerMix: {value: 1}, uPlan: {value: blank}, uPlanOn: {value: 0}, uMask: {value: blank}, uSand: {value: blank}, uHeight: {value: heightTex},
  uOpacity: {value: .85}, uExag: {value: 1}, uSun: {value: new THREE.Vector3(0, 1, 0)},
  uContour: {value: 1}, uHatch: {value: 0}, uShade: {value: .45}, uShadows: {value: 1}, uSandOn: {value: SAND ? 1 : 0},
  uSize: {value: new THREE.Vector2(W, H)}, uGrid: {value: new THREE.Vector2(cols, rows)},
  uNormal: {value: blank}, uHasNormal: {value: 0}, uTexel: {value: new THREE.Vector2(1000, 1000)},
  uTime: {value: 0}, uWind: {value: new THREE.Vector2(sandDir[0], sandDir[1])},
  uHaze: {value: new THREE.Color(0x1d1917)}, uDay: {value: 1}, uFog: {value: 0},
};
const terrainMat = new THREE.ShaderMaterial({
  uniforms, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uExag; varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vElev; varying float vDist;
    void main(){ vUv = uv; vElev = position.y; vec3 p = position; p.y *= uExag;
      vN = normalize(vec3(normal.x * uExag, normal.y, normal.z * uExag)); vW = p;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform sampler2D uBase, uLayer, uLayerPrev, uPlan, uMask, uSand, uHeight, uNormal; uniform float uLayerMix, uPlanOn;
    uniform float uOpacity, uContour, uHatch, uShade, uShadows, uSandOn, uExag, uTime, uHasNormal, uDay, uFog;
    uniform vec3 uSun, uHaze; uniform vec2 uSize, uGrid, uWind, uTexel;
    varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vElev; varying float vDist;
    float line(float e, float step_){ float f = e / step_; float w = fwidth(f) * 1.15; return 1.0 - smoothstep(0.0, w, abs(fract(f - 0.5) - 0.5)); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
    // terrain height (scaled by the relief exaggeration) at world x, z
    float hAt(vec2 xz){ vec2 t = xz / uSize + 0.5; return texture2D(uHeight, t).r * uExag; }
    bool inside(vec2 xz){ return abs(xz.x) < uSize.x * 0.5 && abs(xz.y) < uSize.y * 0.5; }
    // Soft cast shadow: march towards the Sun over the height field.
    float shadow(vec3 p){
      vec3 s = normalize(uSun); if (s.y < 0.02) return 0.0;
      float res = 1.0, t = 6.0;
      for (int i = 0; i < 48; i++) {

        avoid: [{x1: z.x1, y1: z.y1, x2: z.x2, y2: z.y2, r: z.r, r2: z.r2}]})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || ('server answered ' + r.status));
    if (plan !== PLAN) throw new Error('the plan was changed meanwhile');
    // Wait or go round, whichever loses less time. A detour that drops a stop is taken only
    // when waiting is not an option (the vortex would sit on the route for over DV_MAX_WAIT s).
    const detourS = Math.max(0, (j.distance_m - left) / walkMS);
    const goRound = j.dropped.length ? waitS > DV_MAX_WAIT : detourS < waitS;
    const t = s => s < 90 ? fmt(s, 0) + ' s' : fmt(s / 60, 0) + ' min';
    if (!goRound) {
      say(`Waiting ~${t(waitS)} for the dust devil to pass; going round would cost +${t(detourS)}` +
          (j.dropped.length ? ` and drop ${j.dropped.length} stop${j.dropped.length > 1 ? 's' : ''}` : '') + '.');
    } else {
      walk.detour = j.points; walk.names = via.map(v => v.name).filter(n => !j.dropped.includes(n));
      walk.u = 0; walk.hold = false; walk.reroutes++; layout();
      say(`Going round: +${t(detourS)} instead of waiting ~${t(waitS)}` +
          (j.devils_expected != null ? `; dust devil chance on the rest ${fmt(DevilP(j.devils_expected) * 100, 0)} %` : '') +
          (j.dropped.length ? `. Cut off: ${j.dropped.join(', ')}.` : '.'));
    }
  } catch (e) { say(`No way around (${e.message}). Waiting ~${fmt(waitS, 0)} s for it to pass.`, true); }
  walk.pending = false; walk.cool = performance.now() + 2500;
}
const DevilP = e => 1 - Math.exp(-Math.max(e || 0, 0));     // expected encounters -> chance of one
function devilAcrossRoute() {                      // a vortex aimed across the route ahead of the astronaut
  if (!DV || !routeCurve) return;
  const L = Math.max(pathLen(routePoints()), 1), uu = Math.min(.98, walk.u + 220 / L);
  const q = routeCurve.getPointAt(uu), t = routeCurve.getTangentAt(uu);
  const cx = q.x + W / 2, cy = q.z + H / 2, n = Math.hypot(t.x, t.z) || 1, nx = -t.z / n, ny = t.x / n, sp = 26, life = 11;
  devils.push({x: cx - nx * sp * life * .45, y: cy - ny * sp * life * .45, vx: nx * sp, vy: ny * sp,
    age: 0, life, hgt: 420, r0: 26, spin: 3, phase: Math.random() * 100});
}
if (DV) $('dvt').onclick = devilAcrossRoute;
function stepWalk(now) {
  const dt = walk.last ? Math.min(now - walk.last, 100) : 0; walk.last = now;
  if (!routeCurve || !walker.visible) return;
  if (walk.plan !== PLAN) {                        // another plan was chosen or planned: start it from the base
    Object.assign(walk, {plan: PLAN, u: 0, detour: null, names: null, hold: false, done: false, paused: false});
    walk.base = routeCurve.getLength(); clearZone();
  }
  if (walk.zone && now > walk.zoneUntil) clearZone();
  const moving = !walk.done && !walk.paused;
  const watching = moving && DV && devilPoints.visible && toggles.avoid && toggles.avoid[1];
  if (!watching) { if (walk.hold && !walk.pending) walk.hold = false; }
  else if (!walk.pending) {
    const z = threat();
    if (walk.hold) { if (!z) { walk.hold = false; say('The dust devil has passed. Walking on.'); } }
    else if (z && now > walk.cool) avoidDevil(z, now);
  }
  // The clock of the map follows the walk (sun, shadows, how many vortices rise), so the
  // vortices on screen come at the rate the planner counted; touching the time slider stops it.
  if (DV && dv.follow && D.plans && D.plans.startH != null && PLAN && PLAN.summary && moving) {
    dv.hour = (D.plans.startH + Math.min(walk.u, 1) * PLAN.summary.total_time_hours / 1.0275) % 24;
    drawDevilPanel();
  }
  if (!walk.hold && moving) {
    walk.u += dt / (1000 * tripSeconds());
    if (walk.u >= 1) { walk.u = 1; walk.done = true; }                 // arrived: stay until told to go again
  }
  drawTrip();
  const at = Math.min(walk.u, 1);
  walker.position.copy(routeCurve.getPointAt(at)).y += 7;
  if (roverBody.visible) {                          // nose along the route, tilted a little with the slope
    const t = routeCurve.getTangentAt(Math.min(at, .999));
    roverBody.lookAt(walker.position.x + t.x, walker.position.y - 7 + t.y * .6, walker.position.z + t.z);
  }
}
window.__walk = walk; window.__walker = walker;      // for debugging, like window.__viewer

function frame(now) {
  placeCamera();
  updateDevils(now);
  updateSand(now);
  sun();
  // ease the view towards what the chosen level of the column asks for
  uniforms.uFog.value += (view.fog - uniforms.uFog.value) * .06;
  uniforms.uLayerMix.value = Math.min(1, uniforms.uLayerMix.value + .045);
  const airWas = view.air; view.air += ((view.below ? 0 : 1) - view.air) * .07;
  if (devilPoints) devilPoints.material.uniforms.uFade.value = view.air;
  if ((airWas > .01) !== (view.air > .01)) applyToggles();
  strataDepth.value += (STRATA_DEPTH * view.depth - strataDepth.value) * .06;
  // keep it smooth: if frames take too long, render fewer pixels (never below the screen's own)
  if (frame.last) { frame.avg = (frame.avg ?? 16) * .95 + (now - frame.last) * .05; frame.n = (frame.n ?? 0) + 1; }
  frame.last = now;
  if (frame.n > 90 && frame.avg > 42 && pixelRatio > 1 && !document.hidden) {
    pixelRatio = Math.max(1, pixelRatio - .25); renderer.setPixelRatio(pixelRatio); resize(); frame.n = 0; frame.avg = 16;
  }
  if (mouse.fresh && !drag) { mouse.fresh = false; readout(); }
  stepWalk(now);
  const scale = Math.max(.55, Math.min(2.6, cam.r / 1900));
  pins.forEach((p, i) => {
    p.g.scale.setScalar(scale); p.head.rotation.y = now * .0006 + i;
    v.copy(p.g.position); v.y += 80 * scale; v.project(camera);
    const ok = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    p.tag.style.display = ok ? '' : 'none';
    if (ok) { p.tag.style.left = ((v.x + 1) / 2 * canvas.clientWidth) + 'px'; p.tag.style.top = ((1 - v.y) / 2 * canvas.clientHeight) + 'px'; }
  });
  ring.scale.setScalar(Math.max(.6, cam.r / 1500));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('loading').classList.add('gone');
window.__viewer = {D, cam, goal, setLayer, select, uniforms, layers: layers.map(l => l.id), stops: stops.length};
</script>
