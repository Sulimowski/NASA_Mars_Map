<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars Survival Map</title>
<style>
/* A working tool, not a poster: system fonts, panels docked to the window edges, native
   form controls, one selection colour. Nothing is loaded from the network. */
:root{
  --view:#0f1114; --panel:#1b1e22; --head:#23272c; --line:#31363c; --hover:#262b31;
  --text:#d9dce0; --dim:#8d949c; --sel:#2b5f9e; --link:#7db3ea;
  --ok:#4cae6e; --warn:#d9a13a; --bad:#e0664a;
  --bar:38px; --status:26px; --lw:292px; --rw:312px;
  --ui:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--view);color:var(--text);
  font:12.5px/1.45 var(--ui);font-variant-numeric:tabular-nums}
body.bare{--lw:0px;--rw:0px}
body.bare .panel{display:none}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:-2px}

/* ---- frame: top bar, two panels, status bar; the map takes what is left ---- */
.topbar{position:fixed;left:0;right:0;top:0;height:var(--bar);display:flex;align-items:center;gap:14px;
  padding:0 12px;background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
.topbar a{text-decoration:none}
.topbar a:hover{text-decoration:underline}
.topbar .sep{color:var(--dim)}
.topbar h1{margin:0;font-size:13px;font-weight:600;text-transform:capitalize}
.topbar .meta{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.topbar .grow{flex:1}
.panel{position:fixed;top:var(--bar);bottom:var(--status);background:var(--panel);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#4a5058 transparent}
.panel.left{left:0;width:var(--lw);border-right:1px solid var(--line)}
.panel.right{right:0;width:var(--rw);border-left:1px solid var(--line)}
.statusbar{position:fixed;left:0;right:0;bottom:0;height:var(--status);display:flex;align-items:center;gap:18px;
  padding:0 12px;background:var(--head);border-top:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap}
.statusbar .grow{flex:1}
.statusbar span{overflow:hidden;text-overflow:ellipsis}
#sbpos{color:var(--text)}
#gl,#labels{position:fixed;left:var(--lw);right:var(--rw);top:var(--bar);bottom:var(--status)}
#gl{width:calc(100% - var(--lw) - var(--rw));height:calc(100% - var(--bar) - var(--status));display:block;cursor:grab;touch-action:none}
#gl.dragging{cursor:grabbing}
#labels{pointer-events:none;overflow:hidden}

/* ---- labels on the map ---- */
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto;cursor:pointer;
  background:rgba(18,20,23,.88);color:#eceef0;border:1px solid #000;padding:1px 7px 1px 0;font-size:11.5px;line-height:16px}
.tag b{display:inline-block;min-width:17px;text-align:center;margin-right:6px;background:#4a5058;color:#fff;font-weight:600}
.tag.rover b{background:#a8521f} .tag.base b{background:#35805a}
.tag:hover{background:#2a2f35} .tag.on{background:var(--sel)}

/* ---- panel content ---- */
section{border-bottom:1px solid var(--line);padding:0 0 9px}
h2{margin:0 0 7px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--dim);background:var(--head);
  border-bottom:1px solid var(--line)}
section>div,section>table,section>p{margin-left:12px;margin-right:12px}
section>table{width:calc(100% - 24px)}
table{width:100%;border-collapse:collapse}
td{padding:2px 0;vertical-align:top}
td:first-child{color:var(--dim);width:46%}
td:last-child{text-align:right}
.note{margin:6px 0 0;color:var(--dim)}
section>.note{margin:6px 12px 0}

#layers,#stops{margin:0}
.group{padding:5px 12px 2px;color:var(--dim);font-size:11.5px}
.layer{display:flex;align-items:center;gap:8px;padding:3px 12px;cursor:pointer}
.layer:hover,.stop:hover{background:var(--hover)}
.layer.on,.stop.on{background:var(--sel);color:#fff}
.layer input{margin:0;accent-color:#fff}
.layer i{flex:0 0 24px;height:10px;border:1px solid #000;background:#3a3f46}
.legend .bar{height:12px;border:1px solid #000}
.legend .ends{display:flex;justify-content:space-between;margin-top:2px}
.legend .ends em{font-style:normal;color:var(--dim)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.chips span{display:flex;align-items:center;gap:6px}
.chips i{flex:0 0 11px;height:11px;border:1px solid #000}

.ctl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:8px;margin-top:4px;margin-bottom:4px}
.ctl label{color:var(--dim)}
.ctl output{text-align:right}
input[type=range]{width:100%;margin:0;accent-color:var(--link)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin-top:8px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{margin:0;accent-color:var(--link)}

.stop{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:baseline;padding:3px 12px;cursor:pointer}
.stop b{text-align:center;background:#4a5058;color:#fff;font-weight:600;font-size:11.5px}
.stop.rover b{background:#a8521f} .stop.base b{background:#35805a}
.stop small{color:var(--dim);font-size:11.5px} .stop.on small{color:#d5e3f3}
#detail{display:none;margin:9px 12px 0;padding-top:9px;border-top:1px solid var(--line)}
#detail h3{margin:0 0 3px;font-size:13px;font-weight:600}
#detail img{display:block;width:100%;margin-top:8px;border:1px solid #000}

.plans{width:100%;border-collapse:collapse;margin-bottom:9px}
.plans th{font-weight:400;color:var(--dim);text-align:right;padding:0 0 3px}
.plans th:first-child,.plans td:first-child{text-align:left}
.plans td{padding:3px 0;text-align:right}
.plans td:first-child{color:inherit;width:auto;padding-left:4px}
.plans tr.row{cursor:pointer}
.plans tr.row:hover{background:var(--hover)}
.plans tr.row.on{background:var(--sel);color:#fff}
.plans td i{display:inline-block;width:8px;height:8px;margin-right:7px;background:var(--ok)}
.plans td i.bad{background:var(--bad)}
.ctl select{width:100%;font:inherit;color:var(--text);background:var(--view);border:1px solid var(--line);padding:2px 4px}
.ctl.wide{grid-template-columns:84px 1fr}
.ctl button{font:inherit;color:var(--text);background:var(--hover);border:1px solid var(--line);padding:1px 0;cursor:pointer}
.ctl button:hover{background:var(--sel)}
svg.hours{display:block;width:100%;height:64px;margin-top:8px;overflow:visible}
.hours text{font:11px var(--ui);fill:var(--dim)}
.status{display:flex;align-items:center;gap:7px;margin-top:0;margin-bottom:6px;font-weight:600}
.status i{width:9px;height:9px;background:var(--ok)} .status.bad i{background:var(--bad)}
.warn{margin:6px 0 0;color:var(--warn)}
svg.spark{display:block;width:100%;height:56px;margin-top:2px;overflow:visible}
.spark text{font:11px var(--ui);fill:var(--dim)}
.series{margin:8px 0 0}
.series span{color:var(--dim)}

.compass{position:fixed;right:calc(var(--rw) + 12px);top:calc(var(--bar) + 12px);width:44px;height:44px}
.compass svg{width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--view);color:var(--dim);z-index:9}
#loading.gone{display:none}
@media (max-width:1000px){:root{--rw:0px;--lw:264px}.panel.right{display:none}.topbar .meta{display:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header class="topbar">
  <a href="../../gui/index.html">Mars Survival Map</a><span class="sep">/</span>
  <h1 id="title">Site</h1>
  <span class="meta" id="coords"></span>
  <span class="grow"></span>
</header>

<aside class="panel left">
  <section><h2>Site</h2><table id="facts"></table></section>
  <section><h2>Layers</h2><div id="layers"></div></section>
  <section class="legend"><h2>Legend</h2><div id="legend"></div></section>
  <section><h2>View</h2>
    <div class="ctl"><label for="op">Overlay</label><input id="op" type="range" min="0" max="1" step="0.01" value="0.85"><output id="opv"></output></div>
    <div class="ctl"><label for="ex">Relief scale</label><input id="ex" type="range" min="0.5" max="3" step="0.05" value="1"><output id="exv"></output></div>
    <div class="ctl"><label for="az">Sun bearing</label><input id="az" type="range" min="0" max="360" step="1" value="300"><output id="azv"></output></div>
    <div class="ctl"><label for="al">Sun height</label><input id="al" type="range" min="4" max="85" step="1" value="34"><output id="alv"></output></div>
    <div class="toggles" id="toggles"></div>
  </section>
</aside>

<aside class="panel right">
  <section><h2>Under cursor</h2><table id="probe"><tr><td>Move over the terrain</td><td></td></tr></table></section>
  <section><h2>Stops</h2><div id="stops"></div><div id="detail"></div></section>
  <section id="planBox" style="display:none"><h2>EVA plan</h2><div id="plan"></div></section>
  <section id="devilBox" style="display:none"><h2>Dust devils</h2>
    <div class="ctl wide"><label for="dvs">Season</label><select id="dvs"></select></div>
    <div class="ctl"><label for="dvh">Local time</label><input id="dvh" type="range" min="0" max="23.95" step="0.05"><output id="dvhv"></output></div>
    <div class="ctl"><label></label><button id="dvp" type="button">Pause</button><span></span></div>
    <div id="devils"></div>
  </section>
  <section id="condBox" style="display:none"><h2>Conditions by sol</h2><div id="cond"></div></section>
</aside>

<div class="compass" title="North"><svg viewBox="-30 -30 60 60">
  <circle r="27" fill="#1b1e22" stroke="#4a5058"/>
  <g id="needle"><path d="M0-22 6 0H-6Z" fill="#e0664a"/><path d="M0 22 6 0H-6Z" fill="#8d949c"/>
  <text y="-8" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="8" font-weight="600" fill="#fff">N</text></g></svg></div>

<footer class="statusbar">
  <span id="sbpos"></span>
  <span class="grow"></span>
  <span id="foot"></span>
  <span>Drag: orbit. Right-drag: pan. Wheel: zoom. H: panels</span>
</footer>
<div id="loading">Loading terrain…</div>

<script id="three-src" type="text/plain">/*__THREE_SOURCE__*/</script>
<script id="site-data" type="application/json">/*__SITE_DATA__*/</script>
<script type="module">
const D = JSON.parse(document.getElementById('site-data').textContent);
const $ = id => document.getElementById(id);
const u8 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };

async function loadThree() {
  const src = $('three-src').textContent;
  if (src.length > 5000) return import(URL.createObjectURL(new Blob([src], {type: 'text/javascript'})));
  return import(D.threeUrl);                       // the page was built without a cached copy
}
const THREE = await loadThree();
THREE.ColorManagement.enabled = false;

// ---------- terrain data ----------
const {rows, cols, emin, emax} = D.mesh, relief = emax - emin, W = D.width, H = D.height;
const H16 = new Uint16Array(u8(D.mesh.heights).buffer);
const probes = Object.fromEntries(Object.entries(D.probes).map(([k, p]) => [k, {...p, a: u8(p.data)}]));
let exag = 1;
function hAt(x, z) {                                // world metres (centred) -> height above the lowest point
  const fc = Math.min(Math.max((x / W + .5) * (cols - 1), 0), cols - 1.001);
  const fr = Math.min(Math.max((z / H + .5) * (rows - 1), 0), rows - 1.001);
  const c = fc | 0, r = fr | 0, u = fc - c, v = fr - r, i = r * cols + c;
  return ((H16[i] * (1 - u) + H16[i + 1] * u) * (1 - v) + (H16[i + cols] * (1 - u) + H16[i + cols + 1] * u) * v) / 65535 * relief;
}
const world = (xm, ym, lift = 0) => new THREE.Vector3(xm - W / 2, hAt(xm - W / 2, ym - H / 2) * exag + lift, ym - H / 2);

// ---------- renderer ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 5, 40000);

async function texture(uri) {
  // onload, not img.decode(): decode() can wait forever while the tab is in the background
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error('texture failed to load')); i.src = uri; });
  const t = new THREE.Texture(img);
  t.colorSpace = THREE.NoColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter; t.needsUpdate = true;
  return t;
}
const blank = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1); blank.needsUpdate = true;

const uniforms = {
  uBase: {value: blank}, uLayer: {value: blank}, uMask: {value: blank},
  uOpacity: {value: .85}, uExag: {value: 1}, uSun: {value: new THREE.Vector3(0, 1, 0)},
  uContour: {value: 1}, uHatch: {value: 0}, uShade: {value: .45},
  uHaze: {value: new THREE.Color(0x15181b)},
};
const terrainMat = new THREE.ShaderMaterial({
  uniforms, side: THREE.DoubleSide,
  vertexShader: `
    uniform float uExag; varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vElev; varying float vDist;
    void main(){ vUv = uv; vElev = position.y; vec3 p = position; p.y *= uExag;
      vN = normalize(vec3(normal.x * uExag, normal.y, normal.z * uExag)); vW = p;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); vDist = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: `
    uniform sampler2D uBase, uLayer, uMask; uniform float uOpacity, uContour, uHatch, uShade; uniform vec3 uSun, uHaze;
    varying vec2 vUv; varying vec3 vN; varying vec3 vW; varying float vElev; varying float vDist;
    float line(float e, float step_){ float f = e / step_; float w = fwidth(f) * 1.15; return 1.0 - smoothstep(0.0, w, abs(fract(f - 0.5) - 0.5)); }
    void main(){
      vec3 base = texture2D(uBase, vUv).rgb; vec4 lay = texture2D(uLayer, vUv);
      float k = uOpacity * lay.a; vec3 c = mix(base, lay.rgb, k);
      float lit = 0.42 + 0.86 * max(dot(normalize(vN), uSun), 0.0);
      c *= mix(1.0, lit, mix(uShade, 0.85, k));
      float m = texture2D(uMask, vUv).r * uHatch;
      float stripe = step(0.5, fract((vW.x + vW.z) / 13.0));
      c = mix(c, vec3(0.70, 0.13, 0.05), m * (0.30 + 0.45 * stripe));
      float near = 1.0 - smoothstep(2600.0, 5200.0, vDist);
      float ct = max(0.42 * line(vElev, 10.0), 0.72 * line(vElev, 50.0)) * uContour * near;
      c = mix(c, vec3(0.13, 0.08, 0.05), ct);
      c = mix(c, uHaze, 0.42 * smoothstep(2200.0, 9000.0, vDist));
      gl_FragColor = vec4(c, 1.0);
    }`,
});

{ // surface
  const pos = new Float32Array(rows * cols * 3), uv = new Float32Array(rows * cols * 2);
  for (let r = 0, i = 0; r < rows; r++) for (let c = 0; c < cols; c++, i++) {
    pos[i * 3] = (c / (cols - 1) - .5) * W; pos[i * 3 + 1] = H16[i] / 65535 * relief; pos[i * 3 + 2] = (r / (rows - 1) - .5) * H;
    uv[i * 2] = c / (cols - 1); uv[i * 2 + 1] = 1 - r / (rows - 1);
  }
  const idx = new Uint32Array((rows - 1) * (cols - 1) * 6);
  for (let r = 0, k = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
    const a = r * cols + c, b = a + cols; idx[k++] = a; idx[k++] = b; idx[k++] = a + 1; idx[k++] = b; idx[k++] = b + 1; idx[k++] = a + 1;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, terrainMat); mesh.frustumCulled = false; scene.add(mesh);
}
{ // the cut sides of the block, drawn as rock strata
  const depth = Math.max(relief * .16, 40), P = [], T = [], I = [];
  const edge = [];
  for (let c = 0; c < cols; c++) edge.push([0, c]);
  for (let r = 1; r < rows; r++) edge.push([r, cols - 1]);
  for (let c = cols - 2; c >= 0; c--) edge.push([rows - 1, c]);
  for (let r = rows - 2; r >= 0; r--) edge.push([r, 0]);
  edge.forEach(([r, c], n) => {
    const x = (c / (cols - 1) - .5) * W, z = (r / (rows - 1) - .5) * H, h = H16[r * cols + c] / 65535 * relief;
    P.push(x, h, z, x, 0, z); T.push(1, 0);
    const a = n * 2, b = ((n + 1) % edge.length) * 2; I.push(a, a + 1, b, b, a + 1, b + 1);
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setAttribute('top', new THREE.Float32BufferAttribute(T, 1)); g.setIndex(I);
  scene.add(new THREE.Mesh(g, new THREE.ShaderMaterial({
    uniforms: {uExag: uniforms.uExag, uDepth: {value: depth}}, side: THREE.DoubleSide,
    vertexShader: `attribute float top; uniform float uExag, uDepth; varying float vE; varying float vY;
      void main(){ vec3 p = position; vE = top > .5 ? position.y : -uDepth / max(uExag, .01); p.y = top > .5 ? position.y * uExag : -uDepth; vY = p.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
    fragmentShader: `uniform float uDepth; varying float vE; varying float vY;
      void main(){ float f = vE / 10.0; float l = 1.0 - smoothstep(0.0, fwidth(f) * 1.2, abs(fract(f - .5) - .5));
      float band = 0.5 + 0.5 * sin(vE * 0.37) * sin(vE * 0.11);
      vec3 c = mix(vec3(0.20, 0.115, 0.075), vec3(0.36, 0.215, 0.14), band * 0.55);
      c = mix(c, vec3(0.09, 0.05, 0.035), 0.5 * l); c *= 0.62 + 0.38 * smoothstep(-uDepth, 0.0, vY);
      gl_FragColor = vec4(c, 1.0); }`,
  })));
}

// ---------- things on the map ----------
const overlay = new THREE.Group(); scene.add(overlay);
const stops = [{name: 'Base', x: D.start[0], y: D.start[1], kind: 'base', priority: 0, note: 'Start and finish of every walk.', photo: null},
               ...D.targets];
const INK = 0x1f1813, PAPER = 0xefe5cf, RUST = 0xb3461f, GOLD = 0xf2c230, GREEN = 0x3f9a63, ROUTE = 0x12d6c6;
const headOf = k => k === 'base' ? [new THREE.ConeGeometry(15, 26, 4), GREEN]
  : k === 'rover' ? [new THREE.SphereGeometry(11, 20, 14), RUST]
  : k === 'mineral' ? [new THREE.OctahedronGeometry(12), GOLD] : [new THREE.BoxGeometry(17, 17, 17), PAPER];
const pins = stops.map((s, i) => {
  const g = new THREE.Group(), [geo, col] = headOf(s.kind);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 58, 6), new THREE.MeshBasicMaterial({color: PAPER}));
  stem.position.y = 29;
  const head = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: col})); head.position.y = 66;
  const rim = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: INK, side: THREE.BackSide})); rim.position.y = 66; rim.scale.setScalar(1.16);
  g.add(stem, rim, head); overlay.add(g);
  const tag = document.createElement('div');
  tag.className = 'tag ' + s.kind; tag.innerHTML = `<b>${i === 0 ? 'B' : i}</b>${s.name.replace(/ exposure \d+$/, '').replace(/\s*\(.*?\)/, '')}`;
  tag.onclick = () => select(i, true); $('labels').appendChild(tag);
  return {g, head, tag, s};
});
const ring = new THREE.Mesh(new THREE.RingGeometry(13, 16.5, 40), new THREE.MeshBasicMaterial({color: PAPER, side: THREE.DoubleSide, transparent: true, opacity: .9, depthTest: false}));
ring.rotation.x = -Math.PI / 2; ring.visible = false; ring.renderOrder = 5; scene.add(ring);

let trackMesh = null, routeMesh = null, routeCurve = null, t0 = 0, devilPoints = null;
// EVA plans: the planner's three strategies, or the single route of the older format.
const PLANS = D.plans ? D.plans.items : (D.route ? [Object.assign({id: 'route', title: 'EVA route'}, D.route)] : []);
let PLAN = PLANS.find(p => p.id === 'science') || PLANS[0] || null;
const walker = new THREE.Mesh(new THREE.SphereGeometry(9, 16, 12), new THREE.MeshBasicMaterial({color: 0xffffff}));
const halo = new THREE.Mesh(new THREE.SphereGeometry(17, 16, 12), new THREE.MeshBasicMaterial({color: ROUTE, transparent: true, opacity: .35}));
walker.add(halo); walker.visible = false; scene.add(walker);
function tube(points, radius, color, lift) {
  if (!points || points.length < 2) return [null, null];
  const curve = new THREE.CatmullRomCurve3(points.map(p => world(p[0], p[1], lift)), false, 'centripetal', .5);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(points.length * 3, 2400), radius, 6, false), new THREE.MeshBasicMaterial({color}));
  overlay.add(m); return [m, curve];
}
function layout() {                                // everything that sits on the surface follows the relief scale
  pins.forEach(p => p.g.position.copy(world(p.s.x, p.s.y)));
  for (const m of [trackMesh, routeMesh]) if (m) { overlay.remove(m); m.geometry.dispose(); }
  [trackMesh] = tube(D.track, 1.7, PAPER, 2.2);
  [routeMesh, routeCurve] = tube(PLAN && PLAN.points, 3.4, ROUTE, 3.6);
  applyToggles();
}

// ---------- camera: orbit / pan / zoom with easing ----------

  }

  devilPoints.material.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  const A = devilGeo.attributes, pos = A.position.array, alp = A.alpha.array, siz = A.psize.array, col = A.tint.array;
  const {A0, F0, J, K} = dv.pattern, sun = uniforms.uSun.value;
  const sunLow = Math.max(sun.y, .15);
  let n = 0;
  const put = (x, y, z, a, s, r, g, b) => {
    pos[n * 3] = x; pos[n * 3 + 1] = y; pos[n * 3 + 2] = z; alp[n] = a; siz[n] = s;
    col[n * 3] = r; col[n * 3 + 1] = g; col[n * 3 + 2] = b; n++;
  };
  for (const d of devils) {
    const base = world(d.x, d.y, 0), t = d.phase + d.age;
    const env = Math.min(1, d.age / 1.5, (d.life - d.age) / 2);              // fade in and out
    const sp = Math.hypot(d.vx, d.vy), ux = d.vx / sp, uz = d.vy / sp;        // drift direction
    // Shadow: dark soft spots laid on the ground, cast away from the Sun, following the relief.
    for (let k = 0; k < DV_SHADOW; k++) {
      const q = k / (DV_SHADOW - 1), len = Math.min(d.hgt * .9 / sunLow * Math.hypot(sun.x, sun.z), 900) * q;
      const sx = d.x - sun.x / Math.hypot(sun.x, sun.z) * len, sy = d.y - sun.z / Math.hypot(sun.x, sun.z) * len;
      if (sx < 2 || sy < 2 || sx > W - 2 || sy > H - 2) continue;
      const g = world(sx, sy, 2);
      put(g.x, g.y, g.z, env * .14 * (1 - q * .6), d.r0 * (1.2 + 2.2 * q), .06, .03, .02);
    }
    for (let i = 0; i < DV_NP; i++) {
      const kind = K[i];
      // height fraction: arms and core rise and loop; the skirt stays low
      const f = kind === 2 ? F0[i] * .09 : (F0[i] + t * (kind === 0 ? .26 : .18)) % 1;
      // funnel: wide skirt, narrow neck just above the ground, opening towards the top
      const neck = .32 + 2.2 * Math.pow(f, 1.7);
      const r = kind === 2 ? d.r0 * (1.1 + 2.6 * J[i]) : d.r0 * neck * (kind === 0 ? .75 + .45 * J[i] : .3 + .75 * Math.sqrt(J[i]));
      const a = A0[i] + t * d.spin * (kind === 2 ? .7 : 1.9 - 1.1 * f) + (kind === 0 ? f * 4.5 : f * 2.0);   // arms wind up the column
      const h = f * d.hgt;
      // the column sways and its top trails the drift
      const wob = d.r0 * .9 * f;
      const ox = Math.sin(f * 4.2 + t * 1.3) * wob - ux * .22 * h * sp / 30;
      const oz = Math.cos(f * 3.6 + t * 1.1) * wob - uz * .22 * h * sp / 30;
      // dense rust-brown at the foot, pale and thin at the top
      const c = Math.min(1, f * 1.4);
      const alpha = env * (kind === 2 ? .6 * (1 - J[i] * .5) : kind === 0 ? 1 : .75)
        * Math.pow(1 - f, .9) * Math.min(1, (f + .02) / .06);
      put(base.x + Math.cos(a) * r + ox, base.y + h + 1.5, base.z + Math.sin(a) * r + oz, alpha,
        (kind === 2 ? 7 : kind === 0 ? 3.8 : 5.2) * (.8 + 1.0 * f),
        .72 + .27 * c, .5 + .4 * c, .36 + .46 * c);
    }
  }
  devilGeo.setDrawRange(0, n);
  for (const k of ['position', 'alpha', 'psize', 'tint']) A[k].needsUpdate = true;
}

{ const S = D.series, sol = S.sol || [];
  const spark = (title, lines, unit) => {
    const all = lines.flatMap(l => l.v), lo = Math.min(...all), hi = Math.max(...all), n = lines[0].v.length;
    const X = i => 4 + i / Math.max(n - 1, 1) * 252, Y = v => 46 - (v - lo) / Math.max(hi - lo, 1e-9) * 36;
    return `<p class="series">${title} <span>${fmt(lo, lo < 10 && lo > -10 ? 2 : 0)} to ${fmt(hi, hi < 10 && hi > -10 ? 2 : 0)} ${unit}</span></p>
      <svg class="spark" viewBox="0 0 260 58" preserveAspectRatio="none"><line x1="4" x2="256" y1="46" y2="46" stroke="#4a5058" stroke-width="1" vector-effect="non-scaling-stroke"/>
      ${lines.map(l => `<polyline fill="none" stroke="${l.c}" stroke-width="1.5" vector-effect="non-scaling-stroke" points="${l.v.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}"/>`).join('')}
      <text x="4" y="56">sol ${sol[0] ?? 0}</text><text x="256" y="56" text-anchor="end">sol ${sol[sol.length - 1] ?? n - 1}</text></svg>`;
  };
  let h = '';
  if (S.radiation_msv_per_sol) h += spark('Radiation', [{v: S.radiation_msv_per_sol, c: '#e8804a'}], 'mSv per sol');
  if (S.temp_max_c && S.temp_min_c) h += spark('Air temperature', [{v: S.temp_max_c, c: '#e8804a'}, {v: S.temp_min_c, c: '#5aa2d6'}], '°C');
  if (S.ground_temp_max_c && S.ground_temp_min_c) h += spark('Ground temperature', [{v: S.ground_temp_max_c, c: '#e8804a'}, {v: S.ground_temp_min_c, c: '#5aa2d6'}], '°C');
  if (S.dust_opacity_tau) h += spark('Dust opacity', [{v: S.dust_opacity_tau, c: '#c9a24a'}], 'tau');
  if (S.pressure_pa) h += spark('Pressure', [{v: S.pressure_pa, c: '#aab1b9'}], 'Pa');
  if (h) { $('condBox').style.display = ''; $('cond').innerHTML = h + '<p class="note">One value per sol for the whole site.</p>'; }
}

// ---------- go ----------
uniforms.uBase.value = await texture(D.base);
uniforms.uMask.value = await texture(D.mask);
sun(); $('op').oninput(); $('exv').textContent = '1.00'; layout(); setLayer('photo');
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas); resize();
const v = new THREE.Vector3(); t0 = performance.now();
function frame(now) {
  placeCamera();
  updateDevils(now);
  if (mouse.fresh && !drag) { mouse.fresh = false; readout(); }
  if (routeCurve && walker.visible) {
    const u = (((now - t0) / 42000) % 1 + 1) % 1;          // the first frame can be stamped before t0
    walker.position.copy(routeCurve.getPointAt(u)).y += 7;
  }
  const scale = Math.max(.55, Math.min(2.6, cam.r / 1900));
  pins.forEach((p, i) => {
    p.g.scale.setScalar(scale); p.head.rotation.y = now * .0006 + i;
    v.copy(p.g.position); v.y += 80 * scale; v.project(camera);
    const ok = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    p.tag.style.display = ok ? '' : 'none';
    if (ok) { p.tag.style.left = ((v.x + 1) / 2 * canvas.clientWidth) + 'px'; p.tag.style.top = ((1 - v.y) / 2 * canvas.clientHeight) + 'px'; }
  });
  ring.scale.setScalar(Math.max(.6, cam.r / 1500));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
$('loading').classList.add('gone');
window.__viewer = {D, cam, goal, setLayer, select, layers: layers.map(l => l.id), stops: stops.length};
</script>
